server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SERVICE_NAME:ms-users}
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Internal listener. App Service public health check must use /health on the main port.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  health:
    db:
      # Replaced by the SQL-only, rate-limited sqlReadiness contributor below.
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  structured:
    format:
      console: com.markettec.users.config.SafeJsonLogFormatter

---
spring:
  config:
    activate:
      on-profile: "sql-dev | sql-appservice | sql-integration"
users:
  sql:
    readiness:
      # On demand only; shared by readiness and aggregate health, never liveness.
      cache-ttl: 30s
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,sqlReadiness
