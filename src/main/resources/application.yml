server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SERVICE_NAME:ms-users}
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# No authentication flow is exposed. The verifier bean is opt-in for a future trusted caller.
users:
  google:
    enabled: ${USERS_GOOGLE_VERIFIER_ENABLED:false}
    audiences: ${USERS_GOOGLE_AUDIENCES:}
    issuers: ${USERS_GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}
    clock-skew: ${USERS_GOOGLE_CLOCK_SKEW:30s}
    jwks-uri: ${USERS_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    jwks-max-ttl: ${USERS_GOOGLE_JWKS_MAX_TTL:10m}
    jwks-refresh-interval: ${USERS_GOOGLE_JWKS_REFRESH_INTERVAL:10s}

# Internal listener. App Service public health check must use /health on the main port.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  health:
    db:
      # Replaced by the SQL-only, rate-limited sqlReadiness contributor below.
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  structured:
    format:
      console: com.markettec.users.config.SafeJsonLogFormatter

---
spring:
  config:
    activate:
      on-profile: "sql-dev | sql-appservice | sql-integration"
users:
  sql:
    readiness:
      # On demand only; shared by readiness and aggregate health, never liveness.
      cache-ttl: 30s
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,sqlReadiness
