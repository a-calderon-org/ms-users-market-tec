server:
  port: ${PORT:8080}

spring:
  application:
    name: ${SERVICE_NAME:ms-users}
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# No authentication flow is exposed. The verifier bean is opt-in for a future trusted caller.
users:
  gateway:
    # MTEC-12/D04: read the internal user JWT from X-MTEC-User-Authorization (APIM relocates it because
    # Container Apps authentication uses Authorization for the gateway's managed-identity token).
    user-token-relocation:
      enabled: ${USERS_GATEWAY_USER_TOKEN_RELOCATION_ENABLED:false}
  csrf:
    active-kid: ${USERS_CSRF_ACTIVE_KID:}
    keys-json: ${USERS_CSRF_KEYS_JSON:}
  internal-jwt:
    enabled: ${USERS_INTERNAL_JWT_ENABLED:false}
    issuer: ${USERS_INTERNAL_JWT_ISSUER:}
    audience: ${USERS_INTERNAL_JWT_AUDIENCE:}
    public-jwks-uri: ${USERS_INTERNAL_JWT_PUBLIC_JWKS_URI:}
    active-kid: ${USERS_INTERNAL_JWT_ACTIVE_KID:}
    keys-json: ${USERS_INTERNAL_JWT_KEYS_JSON:}
  api:
    http:
      enabled: ${USERS_API_HTTP_ENABLED:false}
      allowed-origins: ${USERS_API_HTTP_ALLOWED_ORIGINS:}
  auth-methods:
    linking:
      enabled: ${USERS_AUTH_METHOD_LINKING_ENABLED:false}
  email:
    enabled: ${USERS_EMAIL_ENABLED:false}
    from: ${USERS_EMAIL_FROM:}
    login-link-base-url: ${USERS_EMAIL_LOGIN_LINK_BASE_URL:}
    proof-link-base-url: ${USERS_EMAIL_PROOF_LINK_BASE_URL:}
    provider:
      endpoint: ${USERS_EMAIL_PROVIDER_ENDPOINT:}
      api-key: ${USERS_EMAIL_PROVIDER_API_KEY:}
  session:
    logout:
      enabled: ${USERS_SESSION_LOGOUT_ENABLED:false}
    refresh:
      enabled: ${USERS_SESSION_REFRESH_ENABLED:false}
    http:
      enabled: ${USERS_SESSION_HTTP_ENABLED:false}
      allowed-origins: ${USERS_SESSION_HTTP_ALLOWED_ORIGINS:}
      public-api-origin: ${USERS_SESSION_HTTP_PUBLIC_API_ORIGIN:}
      https-topology-verified: ${USERS_SESSION_HTTP_HTTPS_TOPOLOGY_VERIFIED:false}
  google:
    enabled: ${USERS_GOOGLE_VERIFIER_ENABLED:false}
    login-enabled: ${USERS_GOOGLE_LOGIN_ENABLED:false}
    login-audience: ${USERS_GOOGLE_LOGIN_AUDIENCE:}
    registration:
      enabled: ${USERS_GOOGLE_REGISTRATION_ENABLED:false}
    http:
      enabled: ${USERS_GOOGLE_HTTP_ENABLED:false}
      allowed-origins: ${USERS_GOOGLE_HTTP_ALLOWED_ORIGINS:}
      public-api-origin: ${USERS_GOOGLE_HTTP_PUBLIC_API_ORIGIN:}
      same-site-verified: ${USERS_GOOGLE_HTTP_SAME_SITE_VERIFIED:false}
    audiences: ${USERS_GOOGLE_AUDIENCES:}
    issuers: ${USERS_GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}
    clock-skew: ${USERS_GOOGLE_CLOCK_SKEW:30s}
    jwks-uri: ${USERS_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    jwks-max-ttl: ${USERS_GOOGLE_JWKS_MAX_TTL:10m}
    jwks-refresh-interval: ${USERS_GOOGLE_JWKS_REFRESH_INTERVAL:10s}

# Internal listener. App Service public health check must use /health on the main port.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  health:
    db:
      # Replaced by the SQL-only, rate-limited sqlReadiness contributor below.
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  structured:
    format:
      console: com.markettec.users.config.SafeJsonLogFormatter

---
spring:
  config:
    activate:
      on-profile: "sql-dev | sql-appservice | sql-integration"
users:
  sql:
    readiness:
      # On demand only; shared by readiness and aggregate health, never liveness.
      cache-ttl: 30s
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,sqlReadiness
